  let k=null;try{k=sessionStorage.getItem('k')||localStorage.getItem('k')}catch(e){}
  if(k)open_(k);else document.getElementById('msg').innerHTML='お送りしたリンクを、<br>そのままタップしてください。';})();
</script>
